name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to the "latest" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write Gemini API key to .env (optional secret)
        run: echo "GEMINI_API_KEY=${GEMINI_API_KEY:-NONE}" > .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: isaac-scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Keep a stable, phone-friendly download at
      # github.com/<owner>/<repo>/releases/latest — one tap to install, no zip.
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk IsaacItemScanner.apk
          SHA_SHORT="$(git rev-parse --short HEAD)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest IsaacItemScanner.apk \
            --title "Latest build" \
            --prerelease \
            --notes "Auto-built from \`main\` @ ${SHA_SHORT}. On your phone: tap **IsaacItemScanner.apk** below, open it, allow install from this source, Install. Works fully offline; a Gemini API key is optional. Debug-signed — updates install over the top."
